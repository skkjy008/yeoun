# 로컬 전체 실행: docker compose up --build  →  http://localhost
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yeoun
      MYSQL_USER: yeoun
      MYSQL_PASSWORD: ${DB_PASSWORD:-yeoun}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-yeoun-backend:local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/yeoun?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: yeoun
      DB_PASSWORD: ${DB_PASSWORD:-yeoun}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-docker-secret-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-yeoun-frontend:local}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
