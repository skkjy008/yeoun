# 로컬 전체 실행: docker compose up --build  →  http://localhost
#  - mysql : DB (스키마는 백엔드 시작 시 Flyway가 만듭니다)
#  - redis : 실시간 알림 Pub/Sub (서버가 여러 대일 때 알림 공유)
#  - seaweedfs : S3 호환 이미지 저장소 (http://localhost:8333)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yeoun
      MYSQL_USER: yeoun
      MYSQL_PASSWORD: ${DB_PASSWORD:-yeoun}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 호환 이미지 저장소 (SeaweedFS). MinIO는 2026년 9월부터 Docker Hub 이미지를 더 이상 제공하지 않아 교체했습니다.
  # 로컬 개발용으로 인증 없이(Allow-All) 동작하며, 운영에서는 AWS S3를 사용합니다. 버킷은 첫 업로드 때 백엔드가 만듭니다.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -ip.bind=0.0.0.0 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-yeoun-backend:local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/yeoun?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: yeoun
      DB_PASSWORD: ${DB_PASSWORD:-yeoun}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-docker-secret-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      S3_BUCKET: ${S3_BUCKET:-yeoun}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-yeoun}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-yeoun-local-secret}
      # 브라우저가 이미지를 받아 가는 주소
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:8333/yeoun}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-yeoun-frontend:local}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  seaweedfs-data:
