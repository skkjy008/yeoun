spring:
  application:
    name: yeoun
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 관리하고, Hibernate는 엔티티와 일치하는지만 검사합니다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    # 2단계까지 Hibernate(ddl-auto=update)로 만든 기존 DB는 V1을 건너뛰고 V2부터 적용합니다.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: 8080
  forward-headers-strategy: framework

yeoun:
  jwt:
    # 운영 환경에서는 반드시 JWT_SECRET 환경 변수로 32바이트 이상 값을 주입하세요.
    secret: ${JWT_SECRET:local-development-secret-key-change-me-0123456789}
    access-token-validity-seconds: ${JWT_VALIDITY_SECONDS:7200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@yeoun.example}
    admin-password: ${ADMIN_PASSWORD:admin1234!}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  ai:
    # Claude API 키가 있으면 취향 큐레이션 문장을 AI로 생성하고, 없으면 규칙 기반 문장을 사용합니다.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
  payment:
    # 토스페이먼츠 개발자센터 > API 키 (결제위젯 연동 키). 비워 두면 모의 결제로 동작합니다.
    toss:
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
      api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    pending-expire-minutes: 30
  commission:
    fee-rate: ${COMMISSION_FEE_RATE:0.10}
    auto-confirm-days: 7
    in-progress-refund-rate: 0.5
  storage:
    local-dir: ${UPLOAD_DIR:./uploads}
    local-public-path: /uploads
    max-file-size: 5242880
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-northeast-2}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      path-style: ${S3_PATH_STYLE:false}
  redis:
    enabled: ${REDIS_ENABLED:false}
    channel: yeoun:notifications

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}

springdoc:
  swagger-ui:
    path: /api/docs

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yeoun?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:yeoun}
    password: ${DB_PASSWORD:yeoun}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:yeoun;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
yeoun:
  storage:
    local-dir: build/h2-uploads

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
