spring:
  application:
    name: yeoun
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  forward-headers-strategy: framework

yeoun:
  jwt:
    # 운영 환경에서는 반드시 JWT_SECRET 환경 변수로 32바이트 이상 값을 주입하세요.
    secret: ${JWT_SECRET:local-development-secret-key-change-me-0123456789}
    access-token-validity-seconds: ${JWT_VALIDITY_SECONDS:7200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@yeoun.example}
    admin-password: ${ADMIN_PASSWORD:admin1234!}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  ai:
    # Claude API 키가 있으면 취향 큐레이션 문장을 AI로 생성하고, 없으면 규칙 기반 문장을 사용합니다.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /api/docs

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yeoun?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:yeoun}
    password: ${DB_PASSWORD:yeoun}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:yeoun;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
